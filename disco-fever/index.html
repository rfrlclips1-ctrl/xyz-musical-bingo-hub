<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Disco Fever | Island Vibes</title>
  <meta name="description" content="Island Vibes Musical Bingo — Disco Fever" />
  <style>
    :root{
      --navy:#062c49;
      --pink:#f2347e;
      --teal:#1cc7c9;
      --gold:#f4b63e;
      --cream:#fff8eb;
      --ink:#082f4c;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--navy);color:var(--cream)}
    body{display:flex;align-items:center;justify-content:center;padding:24px;background:
      radial-gradient(circle at 50% -10%, rgba(28,199,201,.22), transparent 38%),
      linear-gradient(180deg,#083451 0%,#062c49 100%)}
    .card{width:min(760px,100%);background:var(--cream);color:var(--ink);border:3px solid var(--pink);border-radius:24px;overflow:hidden;box-shadow:0 22px 60px rgba(0,0,0,.35)}
    .stripes{height:12px;background:linear-gradient(90deg,var(--pink) 0 33.3%,var(--gold) 33.3% 66.6%,var(--teal) 66.6%)}
    .content{padding:46px 34px 40px;text-align:center}
    .eyebrow{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-size:14px}
    h1{margin:10px 0 4px;font-size:clamp(46px,9vw,86px);line-height:.95;letter-spacing:-.04em;color:var(--pink);text-shadow:4px 4px 0 var(--ink)}
    h2{margin:12px 0 0;font-size:clamp(22px,4vw,34px);letter-spacing:.03em}
    .sub{margin:10px auto 28px;max-width:560px;color:#466176;font-weight:700;line-height:1.5}
    .button{display:inline-flex;align-items:center;justify-content:center;min-width:250px;padding:16px 26px;border-radius:999px;background:var(--pink);color:white;text-decoration:none;font-weight:900;font-size:18px;box-shadow:0 8px 0 #c51d62;transition:.15s transform,.15s box-shadow}
    .button:hover{transform:translateY(2px);box-shadow:0 6px 0 #c51d62}
    .note{margin-top:24px;font-size:14px;color:#607487}
    .footer{padding:18px 24px;background:var(--ink);color:white;text-align:center;font-size:13px;font-weight:700}
    .footer span{color:var(--teal)}
  </style>
</head>
<body>
  <main class="card">
    <div class="stripes"></div>
    <section class="content">
      <div class="eyebrow">Island Vibes • Musical Bingo</div>
      <h1>DISCO FEVER</h1>
      <h2>Dancefloor Classics • 70s Grooves • Good Vibes</h2>
      <p class="sub">Open the official Disco Fever playlist for your Island Vibes Musical Bingo round.</p>
      <a class="button" href="https://open.spotify.com/playlist/3t5nv03xVftPOf7NmvbCAd" target="_blank" rel="noopener noreferrer">OPEN PLAYLIST</a>
      <div class="note">Wednesdays • Musical Bingo • 7:30 PM</div>
    </section>
    <footer class="footer">ISLAND VIBES KAVA BAR • VERO BEACH, FLORIDA &nbsp; <span>@XYandZproductions</span></footer>
  </main>
</body>
</html>
