<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>XYZ Productions — Redirecting</title>
  <style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#081426;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.card{max-width:620px;padding:32px;text-align:center}.small{opacity:.72;font-size:.95rem}a{color:#7ee7ff}</style>
</head>
<body>
  <main class="card">
    <h1>XYZ Productions</h1>
    <p>Taking you to the current website…</p>
    <p class="small">If you are not redirected automatically, <a id="manual" href="https://xyandzpro.netlify.app/">continue here</a>.</p>
  </main>
<script>
(() => {
  const BASE = 'https://xyandzpro.netlify.app';
  const path = location.pathname === '/' ? '/' : location.pathname.replace(/\/{2,}/g,'/');
  const target = BASE + path + location.search + location.hash;
  document.getElementById('manual').href = target;
  location.replace(target);
})();
</script>
</body>
</html>
