<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disco Fever | Mangrove Sands Musical Bingo</title>
  <meta name="description" content="Mangrove Sands Musical Bingo — Disco Fever playlist." />

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg1: #09030d;
      --bg2: #2c0736;
      --purple: #6f1679;
      --pink: #ff4ed7;
      --gold: #e2b34e;
      --cream: #f7e8bf;
      --spotify: #1ed760;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(175,45,170,.35), transparent 40%),
        radial-gradient(circle at 15% 20%, rgba(255,78,215,.18), transparent 28%),
        linear-gradient(180deg, var(--bg2), var(--bg1));
      color: white;
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    .page {
      width: min(760px, 100%);
      text-align: center;
    }

    .brand {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: .18em;
      font-weight: 800;
      font-size: clamp(16px, 3vw, 22px);
      margin-bottom: 8px;
    }

    .subbrand {
      color: var(--cream);
      text-transform: uppercase;
      letter-spacing: .28em;
      font-size: 12px;
      margin-bottom: 28px;
      opacity: .9;
    }

    .card {
      border: 2px solid var(--gold);
      border-radius: 26px;
      padding: clamp(28px, 6vw, 52px);
      background: rgba(20, 3, 27, .88);
      box-shadow:
        0 20px 70px rgba(0,0,0,.45),
        0 0 40px rgba(255,78,215,.10);
    }

    .ball {
      font-size: clamp(58px, 12vw, 92px);
      line-height: 1;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      color: var(--pink);
      font-size: clamp(52px, 12vw, 96px);
      line-height: .9;
      text-transform: uppercase;
      letter-spacing: -.03em;
      text-shadow:
        0 0 8px rgba(255,78,215,.85),
        0 0 24px rgba(157,39,255,.65);
    }

    .copy {
      margin: 24px auto 0;
      max-width: 520px;
      color: var(--cream);
      font-size: clamp(17px, 3vw, 21px);
      line-height: 1.45;
    }

    .spotify {
      display: block;
      margin-top: 30px;
      width: 100%;
      padding: 18px 24px;
      border-radius: 999px;
      background: var(--spotify);
      color: #07150b;
      text-decoration: none;
      font-weight: 900;
      font-size: 18px;
      transition: transform .18s ease, filter .18s ease;
    }

    .spotify:hover,
    .spotify:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.05);
      outline: none;
    }

    .back {
      display: inline-block;
      margin-top: 26px;
      color: var(--gold);
      text-decoration: none;
      font-weight: 700;
    }

    footer {
      margin-top: 34px;
      color: var(--gold);
      font-size: 14px;
      opacity: .9;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <main class="page">
      <div class="brand">Mangrove Sands</div>
      <div class="subbrand">Musical Bingo</div>

      <section class="card">
        <div class="ball" aria-hidden="true">🪩</div>
        <h1>Disco<br>Fever</h1>

        <p class="copy">
          Open the official Disco Fever playlist for tonight's Mangrove Sands Musical Bingo round.
        </p>

        <a
          class="spotify"
          href="https://open.spotify.com/playlist/3t5nv03xVftPOf7NmvbCAd"
          target="_blank"
          rel="noopener noreferrer">
          Open Disco Fever on Spotify
        </a>
      </section>

      <a class="back" href="/mangrove-sands/">← Back to Mangrove Sands</a>

      <footer>@XY&amp;Zproductions</footer>
    </main>
  </div>
</body>
</html>
